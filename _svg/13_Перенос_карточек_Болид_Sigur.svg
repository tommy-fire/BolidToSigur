<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="940" viewBox="0 0 1180 940">
<style>
 .bx{fill:#ffffff;stroke:#33475e;stroke-width:2.4}
 .card{fill:#f2f6fb;stroke:#33475e;stroke-width:2.6}
 .hint{fill:#eef2f7;stroke:#9fb2c6;stroke-width:1.6}
 .okbox{fill:#e9f6ec;stroke:#1a7f37;stroke-width:2.2}
 .warnbox{fill:#fdf3e3;stroke:#b45309;stroke-width:2.2}
 .badbox{fill:#fdeaea;stroke:#b91c1c;stroke-width:2.2}
 .t{font-family:"DejaVu Sans";font-weight:bold;font-size:23px;fill:#1c2430}
 .t2{font-family:"DejaVu Sans";font-weight:bold;font-size:19px;fill:#1c2430}
 .l{font-family:"DejaVu Sans";font-size:16px;fill:#2b3a4d}
 .s{font-family:"DejaVu Sans";font-size:14.5px;fill:#5a6a7e}
 .sm{font-family:"DejaVu Sans";font-size:13px;fill:#6a7a8e}
 .tm{fill:#ffffff;stroke:#33475e;stroke-width:1.6}
 .tmg{fill:#eef6ef;stroke:#1a7f37;stroke-width:1.8}
 .tmb{fill:#eef2fb;stroke:#1a5fb4;stroke-width:1.8}
 .tmo{fill:#f4e9d8;stroke:#b45309;stroke-width:1.6}
 .tl{font-family:"DejaVu Sans Mono";font-weight:bold;font-size:15.5px;fill:#1c2430}
 .tl2{font-family:"DejaVu Sans Mono";font-weight:bold;font-size:13px;fill:#1c2430}
 .wr{stroke:#c0392b;stroke-width:3;fill:none}
 .wg{stroke:#2e7d32;stroke-width:2.6;fill:none}
 .wbl{stroke:#1a5fb4;stroke-width:2.6;fill:none}
 .wo{stroke:#e67e22;stroke-width:2.6;fill:none}
 .wf{stroke:#b91c1c;stroke-width:3.4;fill:none}
 .wd{stroke:#8b95a1;stroke-width:2.4;fill:none;stroke-dasharray:9 6}
 .bl{font-family:"DejaVu Sans";font-size:13.5px;fill:#0b62b8}
 .rl{font-family:"DejaVu Sans";font-size:13.5px;fill:#a01b1b}
</style>
<rect width="1180" height="940" fill="#ffffff"/>
<text class="t" x="34" y="44">БЛОК 13 — Миграция картотеки: «Орион Про» → Sigur</text>
<line x1="34" y1="58" x2="1146" y2="58" stroke="#0b62b8" stroke-width="3"/>
<rect class="card" x="40" y="90" width="1100" height="110" rx="7"/>
<text class="t2" x="56" y="118">ШАГ 1 — ЭКСПОРТ ИЗ «ОРИОН ПРО»</text>
<text class="l" x="56" y="146">Путь 1 (основной): Мастер импорта/экспорта — ImportWizard.exe в папке АРМ «Орион Про». Отдаёт CSV.</text>
<text class="l" x="56" y="170">Путь 2 (если нужны все поля): запрос к БД MS SQL — таблицы pList (люди) и pMark (коды карт).</text>
<text class="sm" x="56" y="194">Формат CSV описан в папке АРМ «Орион Про» → Doc → «015 - Мастер импорта и экспорта.pdf»</text>
<polyline class="wg" points="590,200 590,240" fill="none"/>
<rect class="bx" x="40" y="240" width="1100" height="190" rx="7"/>
<text class="t2" x="56" y="268">ШАГ 2 — ПРЕОБРАЗОВАНИЕ КОДА КАРТЫ (самое важное)</text>
<text class="l" x="56" y="296">Код из «Орион Про» — 8 байт. Sigur берёт 4 правых байта и отбрасывает последний;</text>
<text class="l" x="56" y="320">левый из оставшихся — фасилити-код, два остальных — номер карты. Всё в десятичный вид.</text>
<rect class="tm" x="56" y="348" width="62" height="30" rx="3"/><text class="tl2" x="65" y="368.5">AE</text>
<rect class="tm" x="124" y="348" width="62" height="30" rx="3"/><text class="tl2" x="133" y="368.5">00</text>
<rect class="tm" x="192" y="348" width="62" height="30" rx="3"/><text class="tl2" x="201" y="368.5">1E</text>
<rect class="tm" x="260" y="348" width="62" height="30" rx="3"/><text class="tl2" x="269" y="368.5">00</text>
<rect class="tmg" x="328" y="348" width="62" height="30" rx="3"/><text class="tl2" x="337" y="368.5">6E</text>
<rect class="tmg" x="396" y="348" width="62" height="30" rx="3"/><text class="tl2" x="405" y="368.5">14</text>
<rect class="tmg" x="464" y="348" width="62" height="30" rx="3"/><text class="tl2" x="473" y="368.5">F1</text>
<rect class="tmo" x="532" y="348" width="62" height="30" rx="3"/><text class="tl2" x="541" y="368.5">01</text>
<text class="t2" x="614" y="370">→</text>
<rect class="tmg" x="650" y="348" width="90" height="30" rx="3"/><text class="tl2" x="659" y="368.5">110</text>
<rect class="tmg" x="748" y="348" width="110" height="30" rx="3"/><text class="tl2" x="757" y="368.5">05361</text>
<text class="sm" x="650" y="396">фасилити</text>
<text class="sm" x="748" y="396">номер</text>
<text class="sm" x="56" y="418">Проверка: 6E→110, 14F1→5361. Этот же пример приведён в официальной статье Sigur.</text>
<polyline class="wg" points="590,430 590,470" fill="none"/>
<rect class="bx" x="40" y="470" width="1100" height="120" rx="7"/>
<text class="t2" x="56" y="498">ШАГ 3 — ТАБЛИЦА .xls</text>
<text class="l" x="56" y="526">Готовит программа с окном из Блока 15 (или консольный конвертер). Только .xls, ячейки — текст.</text>
<text class="l" x="56" y="550">У одного сотрудника до 5 карт: доп. строки содержат только «Номер пропуска» и «Срок действия».</text>
<text class="sm" x="56" y="578">Программа достаёт и фотографии — если они есть в выгрузке.</text>
<polyline class="wg" points="590,590 590,630" fill="none"/>
<rect class="bx" x="40" y="630" width="1100" height="120" rx="7"/>
<text class="t2" x="56" y="658">ШАГ 4 — ИМПОРТ В SIGUR</text>
<text class="l" x="56" y="686">Вкладка «Персонал» → «Импорт из таблицы MS Excel» → сопоставить столбцы → «Импортировать».</text>
<text class="rl" x="56" y="714">ПЕРЕД ИМПОРТОМ ОБЯЗАТЕЛЬНО: «Управление сервером» → «База данных» → «Экспорт базы».</text>
<text class="l" x="56" y="742">Сначала — пробные 5 карт. Заработали — импортируйте остальные.</text>
<polyline class="wg" points="590,750 590,790" fill="none"/>
<rect class="warnbox" x="40" y="790" width="1100" height="120" rx="7"/>
<text class="t2" x="56" y="818">ЧТО НЕ ПЕРЕНОСИТСЯ АВТОМАТИЧЕСКИ</text>
<text class="l" x="56" y="846">Уровни доступа «Орион Про» и режимы доступа Sigur — разные вещи. Конвертер выгрузит</text>
<text class="l" x="56" y="870">список «кто — какой уровень» отдельным CSV, но права в Sigur создаются заново.</text>
<text class="sm" x="56" y="898">Фото перенесёт программа (Блок 15), если они есть в выгрузке. Графики и PIN — вручную.</text>
</svg>