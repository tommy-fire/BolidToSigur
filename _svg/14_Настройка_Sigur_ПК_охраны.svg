<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="910" viewBox="0 0 1180 910">
<style>
 .bx{fill:#ffffff;stroke:#33475e;stroke-width:2.4}
 .card{fill:#f2f6fb;stroke:#33475e;stroke-width:2.6}
 .hint{fill:#eef2f7;stroke:#9fb2c6;stroke-width:1.6}
 .okbox{fill:#e9f6ec;stroke:#1a7f37;stroke-width:2.2}
 .warnbox{fill:#fdf3e3;stroke:#b45309;stroke-width:2.2}
 .badbox{fill:#fdeaea;stroke:#b91c1c;stroke-width:2.2}
 .t{font-family:"DejaVu Sans";font-weight:bold;font-size:23px;fill:#1c2430}
 .t2{font-family:"DejaVu Sans";font-weight:bold;font-size:19px;fill:#1c2430}
 .l{font-family:"DejaVu Sans";font-size:16px;fill:#2b3a4d}
 .s{font-family:"DejaVu Sans";font-size:14.5px;fill:#5a6a7e}
 .sm{font-family:"DejaVu Sans";font-size:13px;fill:#6a7a8e}
 .tm{fill:#ffffff;stroke:#33475e;stroke-width:1.6}
 .tmg{fill:#eef6ef;stroke:#1a7f37;stroke-width:1.8}
 .tmb{fill:#eef2fb;stroke:#1a5fb4;stroke-width:1.8}
 .tmo{fill:#f4e9d8;stroke:#b45309;stroke-width:1.6}
 .tl{font-family:"DejaVu Sans Mono";font-weight:bold;font-size:15.5px;fill:#1c2430}
 .tl2{font-family:"DejaVu Sans Mono";font-weight:bold;font-size:13px;fill:#1c2430}
 .wr{stroke:#c0392b;stroke-width:3;fill:none}
 .wg{stroke:#2e7d32;stroke-width:2.6;fill:none}
 .wbl{stroke:#1a5fb4;stroke-width:2.6;fill:none}
 .wo{stroke:#e67e22;stroke-width:2.6;fill:none}
 .wf{stroke:#b91c1c;stroke-width:3.4;fill:none}
 .wd{stroke:#8b95a1;stroke-width:2.4;fill:none;stroke-dasharray:9 6}
 .bl{font-family:"DejaVu Sans";font-size:13.5px;fill:#0b62b8}
 .rl{font-family:"DejaVu Sans";font-size:13.5px;fill:#a01b1b}
</style>
<rect width="1180" height="910" fill="#ffffff"/>
<text class="t" x="34" y="44">БЛОК 14 — Настройка Sigur на компьютере охраны</text>
<line x1="34" y1="58" x2="1146" y2="58" stroke="#0b62b8" stroke-width="3"/>
<rect class="bx" x="50" y="90" width="300" height="215" rx="7"/>
<text class="t2" x="66" y="120">ПК-СЕРВЕР SIGUR</text>
<text class="l" x="66" y="148">серверный модуль + БД</text>
<text class="l" x="66" y="172">лицензия (HASP ключ или ПО)</text>
<rect class="tmb" x="66" y="190" width="150" height="30" rx="3"/><text class="tl2" x="75" y="210.5">IP 192.168.1.10</text>
<text class="l" x="66" y="244">клиенты: TCP 3308</text>
<text class="l" x="66" y="268">база данных: TCP 3305</text>
<text class="l" x="66" y="292">видеоархив: TCP 3314</text>
<rect class="bx" x="830" y="90" width="300" height="215" rx="7"/>
<text class="t2" x="846" y="120">КОМПЬЮТЕР ОХРАНЫ</text>
<text class="l" x="846" y="148">ПО «Клиент»</text>
<text class="l" x="846" y="172">вход: логин + пароль</text>
<text class="l" x="846" y="196">оператора системы</text>
<text class="l" x="846" y="244">исходящие TCP 3308, 3305,</text>
<text class="l" x="846" y="268">3314 — обычно открыты</text>
<polyline class="wbl" points="350,155 830,155" fill="none"/>
<text class="l" x="430" y="147">TCP 3308 — команды и события (TLS — 3309)</text>
<polyline class="wo" points="350,205 830,205" fill="none"/>
<text class="l" x="430" y="197">TCP 3305 — прямые запросы к базе данных</text>
<polyline class="wd" points="350,255 830,255" fill="none"/>
<text class="l" x="430" y="247">TCP 3314 — видеоархив (TLS — 3315)</text>
<rect class="card" x="50" y="330" width="1080" height="230" rx="7"/>
<text class="t2" x="66" y="358">ПОРЯДОК НАСТРОЙКИ</text>
<text class="l" x="66" y="392">1. Установить ПО: setup-XX.exe от имени администратора, выбрать компонент «Клиент»</text>
<text class="l" x="66" y="418">2. Запустить «Клиент» → «Вход в систему» → кнопка «...» → «Выбор сервера СКУД Sigur»</text>
<text class="l" x="66" y="444">3. «Добавить» → имя сервера, IP-адрес; порты: клиент 3308, база 3305, видео 3314</text>
<text class="l" x="66" y="470">4. Чекбокс «Использовать безопасное подключение» — должен совпадать с настройкой сервера</text>
<text class="l" x="66" y="496">5. Сохранить «OK». Настройки подключения хранятся локально, у каждого пользователя ОС свои</text>
<text class="l" x="66" y="522">6. Войти под учётной записью оператора (логин и пароль задаёт администратор)</text>
<text class="l" x="66" y="548">7. Проверить: видны события, точки доступа, персонал. Ярлык — в автозагрузку</text>
<rect class="badbox" x="50" y="575" width="1080" height="105" rx="7"/>
<text class="t2" x="66" y="603">ОШИБКА «СОЕДИНЕНИЯ С БАЗОЙ ДАННЫХ» = НА СЕРВЕРЕ ЗАКРЫТ TCP 3305</text>
<text class="rl" x="66" y="631">Клиент на самом сервере заходит? → ping → Test-NetConnection IP -Port 3305</text>
<text class="rl" x="66" y="657">Лечение: брандмауэр Windows на СЕРВЕРЕ → разрешить входящие TCP 3308 и 3305</text>
<rect class="okbox" x="50" y="700" width="530" height="190" rx="7"/>
<text class="t2" x="66" y="728">ЧТО ДАТЬ ОХРАНЕ</text>
<text class="l" x="66" y="756">• просмотр событий в реальном времени</text>
<text class="l" x="66" y="782">• журнал и отчёты по проходам</text>
<text class="l" x="66" y="808">• приём и выдача пропусков</text>
<text class="l" x="66" y="834">• добавление посетителей</text>
<text class="sm" x="66" y="866">«Файл» – «Настройки» – «Права операторов» — шаблоны</text>
<rect class="badbox" x="600" y="700" width="530" height="190" rx="7"/>
<text class="t2" x="616" y="728">ЧТО НЕ ДАВАТЬ</text>
<text class="l" x="616" y="756">• настройка оборудования и контроллеров</text>
<text class="l" x="616" y="782">• удаление сотрудников из базы</text>
<text class="l" x="616" y="808">• импорт из Excel (перезапишет базу)</text>
<text class="l" x="616" y="834">• управление лицензиями и БД</text>
<text class="sm" x="616" y="866">Права по шаблону применяются ОДИН раз</text>
</svg>