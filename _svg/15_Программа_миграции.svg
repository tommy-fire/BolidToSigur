<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1060" viewBox="0 0 1180 1060">
<style>
 .bx{fill:#ffffff;stroke:#33475e;stroke-width:2.4}
 .card{fill:#f2f6fb;stroke:#33475e;stroke-width:2.6}
 .hint{fill:#eef2f7;stroke:#9fb2c6;stroke-width:1.6}
 .okbox{fill:#e9f6ec;stroke:#1a7f37;stroke-width:2.2}
 .warnbox{fill:#fdf3e3;stroke:#b45309;stroke-width:2.2}
 .badbox{fill:#fdeaea;stroke:#b91c1c;stroke-width:2.2}
 .t{font-family:"DejaVu Sans";font-weight:bold;font-size:23px;fill:#1c2430}
 .t2{font-family:"DejaVu Sans";font-weight:bold;font-size:19px;fill:#1c2430}
 .l{font-family:"DejaVu Sans";font-size:16px;fill:#2b3a4d}
 .s{font-family:"DejaVu Sans";font-size:14.5px;fill:#5a6a7e}
 .sm{font-family:"DejaVu Sans";font-size:13px;fill:#6a7a8e}
 .tm{fill:#ffffff;stroke:#33475e;stroke-width:1.6}
 .tmg{fill:#eef6ef;stroke:#1a7f37;stroke-width:1.8}
 .tmb{fill:#eef2fb;stroke:#1a5fb4;stroke-width:1.8}
 .tmo{fill:#f4e9d8;stroke:#b45309;stroke-width:1.6}
 .tl{font-family:"DejaVu Sans Mono";font-weight:bold;font-size:15.5px;fill:#1c2430}
 .tl2{font-family:"DejaVu Sans Mono";font-weight:bold;font-size:13px;fill:#1c2430}
 .wr{stroke:#c0392b;stroke-width:3;fill:none}
 .wg{stroke:#2e7d32;stroke-width:2.6;fill:none}
 .wbl{stroke:#1a5fb4;stroke-width:2.6;fill:none}
 .wo{stroke:#e67e22;stroke-width:2.6;fill:none}
 .wd{stroke:#8b95a1;stroke-width:2.4;fill:none;stroke-dasharray:9 6}
</style>
<rect width="1180" height="1060" fill="#ffffff"/>
<text class="t" x="34" y="44">БЛОК 15 — Программа переноса картотеки: «загрузил → скачал»</text>
<line x1="34" y1="58" x2="1146" y2="58" stroke="#0b62b8" stroke-width="3"/>
<rect class="okbox" x="40" y="90" width="1100" height="130" rx="7"/>
<text class="t2" x="56" y="118">УСТАНОВКА (ОДИН РАЗ, минут десять)</text>
<text class="l" x="56" y="146">1. Python с сайта www.python.org/downloads — на ПЕРВОМ экране установщика</text>
<text class="l" x="56" y="172">    поставить галочку «Add Python to PATH», дальше просто Install Now</text>
<text class="l" x="56" y="198">2. Запустить_миграцию.bat двойным щелчком — сам поставит библиотеки и откроет окно</text>
<polyline class="wg" points="590,220 590,258" fill="none"/>
<rect class="card" x="40" y="258" width="1100" height="150" rx="7"/>
<text class="t2" x="56" y="286">ЧТО ЗАГРУЖАЕМ — любой файл, выгруженный из «Орион Про»</text>
<rect class="tm" x="56" y="306" width="96" height="32" rx="3"/><text class="tl2" x="65" y="327.5">CSV</text>
<rect class="tm" x="164" y="306" width="96" height="32" rx="3"/><text class="tl2" x="173" y="327.5">XML</text>
<rect class="tm" x="272" y="306" width="96" height="32" rx="3"/><text class="tl2" x="281" y="327.5">XLS</text>
<rect class="tm" x="380" y="306" width="96" height="32" rx="3"/><text class="tl2" x="389" y="327.5">XLSX</text>
<text class="l" x="500" y="328">— откуда: ImportWizard.exe, «Генератор отчётов», SQL-выгрузка</text>
<text class="l" x="56" y="366">Кодировки cp1251 / UTF-8 / cp866 и разделители ; , | TAB — определяются сами.</text>
<text class="sm" x="56" y="392">Фотографии могут лежать прямо в выгрузке — программа их найдёт.</text>
<polyline class="wg" points="590,408 590,446" fill="none"/>
<rect class="bx" x="40" y="446" width="1100" height="250" rx="7"/>
<text class="t2" x="56" y="474">ПРОГРАММА — Миграция_Болид_Sigur.pyw (окно с кнопками)</text>
<text class="l" x="56" y="502">1. «Обзор…» → выбрали файл → сразу видно, что программа поняла:</text>
<text class="l" x="56" y="528">     сколько строк, как зовут колонки, сколько кодов карт распознано</text>
<text class="l" x="56" y="554">2. Сопоставление колонок — программа ставит сама, можно поправить руками</text>
<text class="l" x="56" y="580">3. Предпросмотр: колонки «Код (как было)» и «В Sigur» — проверить глазами 10–20 строк</text>
<rect class="tm" x="56" y="600" width="340" height="32" rx="3"/><text class="tl2" x="65" y="621.5">AE001E006E14F101</text>
<text class="t2" x="404" y="622">→</text>
<rect class="tmg" x="430" y="600" width="130" height="32" rx="3"/><text class="tl2" x="439" y="621.5">110,05361</text>
<text class="l" x="580" y="622">— если видите такие пары, всё верно</text>
<text class="l" x="56" y="662">4. Фото: base64 / data-URI / hex распознаются по сигнатуре файла → Фото\таб№.jpg</text>
<text class="l" x="56" y="688">Кнопка «СДЕЛАТЬ ФАЙЛ ДЛЯ SIGUR» — и всё.</text>
<polyline class="wg" points="590,696 590,734" fill="none"/>
<rect class="okbox" x="40" y="734" width="1100" height="160" rx="7"/>
<text class="t2" x="56" y="762">ЧТО СКАЧИВАЕМ (появляется в указанной папке)</text>
<rect class="tmg" x="56" y="782" width="260" height="32" rx="3"/><text class="tl2" x="65" y="803.5">Импорт_для_Sigur.xls</text>
<text class="l" x="330" y="804">→ Sigur: «Персонал» → «Импорт из таблицы MS Excel»</text>
<rect class="tmb" x="56" y="826" width="130" height="32" rx="3"/><text class="tl2" x="65" y="847.5">Фото\</text>
<text class="l" x="198" y="848">фотографии сотрудников</text>
<rect class="tmo" x="340" y="826" width="130" height="32" rx="3"/><text class="tl2" x="349" y="847.5">Отчёт.txt</text>
<text class="l" x="482" y="848">читать обязательно</text>
<rect class="tmb" x="700" y="826" width="240" height="32" rx="3"/><text class="tl2" x="709" y="847.5">Уровни_доступа.csv</text>
<text class="l" x="56" y="882">Перед импортом: бэкап базы Sigur («Экспорт базы») → пробные 5 карт → остальные.</text>
<polyline class="wo" points="590,894 590,932" fill="none"/>
<rect class="warnbox" x="40" y="932" width="1100" height="100" rx="7"/>
<text class="t2" x="56" y="960">ЕСЛИ ПРОГРАММА ЧТО-ТО НЕ ПОНЯЛА</text>
<text class="l" x="56" y="988">Кнопка «Диагностика» → появится Диагностика.txt (колонки + первые строки).</text>
<text class="l" x="56" y="1014">Пришлите этот файл — программа подгоняется под ваш формат за один круг.</text>
</svg>